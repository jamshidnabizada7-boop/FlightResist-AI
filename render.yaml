services:
  - type: web
    name: flightresist-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: ATLAS_MODE
        value: auto
      - key: ATLAS_APPKEY
        sync: false
      - key: ATLAS_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_ID
        sync: false
      - key: GITHUB_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: DEPLOY_TARGET
        value: standalone
